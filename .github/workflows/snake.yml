name: Gera a cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: rosystt
          outputs: |
            dist/github-snake.svg?color_snake=#D9A5A0&color_dots=#F5EDE9,#E8D5CF,#D9A5A0,#C98B86,#3B3331
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
